services:
  api:
    build: .
    container_name: llm-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/llm_service
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg17
    container_name: llm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: llm-redis
    ports:
      - "6379:6379"

  worker:
    build: .
    container_name: llm-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/llm_service
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  uploads: